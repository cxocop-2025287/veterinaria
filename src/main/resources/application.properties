# ===============================================
# CONFIGURACIÓN DE BASE DE DATOS MYSQL
# ===============================================
# Modifica los siguientes valores o define variables de entorno:
# DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/db_veterinaria_in5am?createDatabaseIfNotExist=true
spring.datasource.username=IN5AM
spring.datasource.password=_odmon5Am
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=8001
# ===============================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================================
# INICIALIZACIÓN DE DATOS (data.sql)
# ===============================================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ===============================================
# CONFIGURACIÓN DE SEGURIDAD Y JWT
# ===============================================
# Clave secreta HMAC-SHA256 en Base64 (mínimo 256 bits)
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiración del token en milisegundos (24 horas = 86400000 ms)
application.security.jwt.expiration=14400000

# ===============================================
# FORMATO DE FECHAS Y ZONA HORARIA
# ===============================================
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Guatemala
